<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMatch — Profile</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="main-nav"></div>
<div id="main-sidebar"></div>

<main class="main-content page-enter" id="profile-main">
  <div style="display:flex;justify-content:center;padding:80px"><div class="spinner"></div></div>
</main>

<!-- EDIT PROFILE MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 class="text-2xl" style="margin-bottom:20px">Edit Profile</h3>
    <div class="input-group" style="margin-bottom:14px">
      <label class="input-label">Username</label>
      <input class="input" id="edit-username">
    </div>
    <div class="input-group" style="margin-bottom:14px">
      <label class="input-label">Bio</label>
      <textarea class="input" id="edit-bio" rows="3" placeholder="Tell us about yourself…" style="resize:vertical"></textarea>
    </div>
    <div class="input-group" style="margin-bottom:24px">
      <label class="input-label">Avatar URL</label>
      <input class="input" id="edit-avatar" placeholder="https://…">
    </div>
    <button class="btn btn-primary w-full" onclick="saveProfile()">Save Changes</button>
    <button class="btn btn-ghost w-full" style="margin-top:8px" onclick="ui.closeModal('edit-modal')">Cancel</button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>
<script>
  initPage('profile');
  const params = new URLSearchParams(location.search);
  const profileId = params.get('id');
  const currentUser = auth.getUser();
  const isOwnProfile = !profileId || profileId === currentUser?._id;

  async function loadProfile() {
    try {
      const targetId = isOwnProfile ? currentUser._id : profileId;
      const [profileData, watchlistData, reviewsData, activityData] = await Promise.all([
        isOwnProfile ? { user: currentUser, isFriend: false } : api.users.get(targetId),
        api.watchlist.getUser(targetId),
        api.reviews.getByUser(targetId),
        api.activity.user(targetId)
      ]);

      renderProfile(profileData, watchlistData.items || [], reviewsData.reviews || [], activityData.activities || []);
    } catch (err) {
      document.getElementById('profile-main').innerHTML = `<div style="text-align:center;padding:80px;color:var(--text-dim)">${err.message}</div>`;
    }
  }

  function renderProfile(data, watchlist, reviews, activities) {
    const { user, isFriend, sentRequest, receivedRequest } = data;
    const unwatched = watchlist.filter(w => !w.watched);
    const watched = watchlist.filter(w => w.watched);

    let friendBtn = '';
    if (!isOwnProfile) {
      if (isFriend) {
        friendBtn = `<button class="btn btn-ghost btn-sm" onclick="removeFriend('${user._id}')">✓ Friends</button>`;
      } else if (sentRequest) {
        friendBtn = `<button class="btn btn-ghost btn-sm" disabled>Request Sent</button>`;
      } else if (receivedRequest) {
        friendBtn = `<button class="btn btn-primary btn-sm" onclick="acceptRequest('${user._id}')">Accept Request</button>`;
      } else {
        friendBtn = `<button class="btn btn-primary btn-sm" onclick="sendRequest('${user._id}')">+ Add Friend</button>`;
      }
    }

    document.getElementById('profile-main').innerHTML = `
      <!-- HEADER -->
      <div style="display:flex;align-items:flex-start;gap:28px;margin-bottom:40px;flex-wrap:wrap">
        ${user.avatar
          ? `<img src="${user.avatar}" class="avatar avatar-xl" alt="${user.username}">`
          : `<div class="avatar avatar-xl">${auth.getUserInitials(user)}</div>`
        }
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px">
            <h1 style="font-family:var(--font-display);font-size:clamp(32px,5vw,56px)">${user.username}</h1>
            ${isOwnProfile ? `<button class="btn btn-ghost btn-sm" onclick="openEditModal()">Edit Profile</button>` : friendBtn}
          </div>
          ${user.bio ? `<p style="color:var(--text-dim);font-size:15px;margin-bottom:12px;max-width:500px">${user.bio}</p>` : ''}
          <div style="display:flex;gap:28px">
            <div><span style="font-weight:900;font-size:20px">${watchlist.length}</span><span class="text-dim text-sm" style="margin-left:6px">Watchlist</span></div>
            <div><span style="font-weight:900;font-size:20px">${watched.length}</span><span class="text-dim text-sm" style="margin-left:6px">Watched</span></div>
            <div><span style="font-weight:900;font-size:20px">${reviews.length}</span><span class="text-dim text-sm" style="margin-left:6px">Reviews</span></div>
            <div><span style="font-weight:900;font-size:20px">${user.friends?.length || 0}</span><span class="text-dim text-sm" style="margin-left:6px">Friends</span></div>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('watchlist', this)">Watchlist (${unwatched.length})</div>
        <div class="tab" onclick="switchTab('watched', this)">Watched (${watched.length})</div>
        <div class="tab" onclick="switchTab('reviews', this)">Reviews (${reviews.length})</div>
        <div class="tab" onclick="switchTab('activity', this)">Activity</div>
      </div>

      <!-- WATCHLIST TAB -->
      <div id="tab-watchlist" class="tab-content">
        ${unwatched.length
          ? `<div class="movie-grid-lg">${unwatched.map(w => watchlistCard(w, isOwnProfile)).join('')}</div>`
          : ui.empty('Watchlist is empty')}
      </div>

      <!-- WATCHED TAB -->
      <div id="tab-watched" class="tab-content hidden">
        ${watched.length
          ? `<div class="movie-grid-lg">${watched.map(w => watchlistCard(w, false)).join('')}</div>`
          : ui.empty('No watched movies yet')}
      </div>

      <!-- REVIEWS TAB -->
      <div id="tab-reviews" class="tab-content hidden">
        ${reviews.length ? reviews.map(r => `
          <div class="surface" style="padding:20px;margin-bottom:16px;display:flex;gap:16px">
            ${r.moviePoster ? `<img src="${imgUrl(r.moviePoster,'w92')}" style="width:56px;border-radius:10px;object-fit:cover;flex-shrink:0" onclick="window.location.href='movie.html?id=${r.movieId}'" class="cursor-pointer">` : ''}
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
                <a href="movie.html?id=${r.movieId}" style="font-weight:700">${r.movieTitle}</a>
                <div class="rating-ring ${ratingClass(r.rating)}" style="width:36px;height:36px;font-size:12px">${r.rating}/10</div>
                <span class="text-dim text-sm" style="margin-left:auto">${timeAgo(r.createdAt)}</span>
              </div>
              ${r.content ? `<p style="color:var(--text-dim);font-size:14px;line-height:1.6">${r.content}</p>` : ''}
            </div>
          </div>`).join('') : ui.empty('No reviews yet')}
      </div>

      <!-- ACTIVITY TAB -->
      <div id="tab-activity" class="tab-content hidden surface" style="padding:0 24px">
        ${activities.length ? activities.map(a => ui.activityItem(a)).join('') : ui.empty('No activity yet')}
      </div>
    `;
  }

  function watchlistCard(item, showActions) {
    return `
      <div class="movie-card" onclick="window.location.href='movie.html?id=${item.movieId}'">
        ${item.posterPath
          ? `<img src="${imgUrl(item.posterPath)}" alt="${item.title}" loading="lazy">`
          : `<div class="movie-card-placeholder">${item.title}</div>`
        }
        <div class="movie-card-overlay">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px">${item.title}</div>
          ${showActions && !item.watched ? `
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();markWatched(${item.movieId})">Mark Watched</button>
          ` : ''}
          ${item.watched ? '<span class="badge badge-white">✓ Watched</span>' : ''}
        </div>
      </div>`;
  }

  function switchTab(tabId, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    el.classList.add('active');
    document.getElementById('tab-' + tabId).classList.remove('hidden');
  }

  function openEditModal() {
    const user = auth.getUser();
    document.getElementById('edit-username').value = user.username || '';
    document.getElementById('edit-bio').value = user.bio || '';
    document.getElementById('edit-avatar').value = user.avatar || '';
    ui.openModal('edit-modal');
  }

  async function saveProfile() {
    const username = document.getElementById('edit-username').value;
    const bio = document.getElementById('edit-bio').value;
    const avatar = document.getElementById('edit-avatar').value;
    try {
      const { user } = await api.users.updateProfile({ username, bio, avatar });
      auth.setSession(auth.getToken(), user);
      ui.success('Profile updated!');
      ui.closeModal('edit-modal');
      loadProfile();
    } catch (err) { ui.error(err.message); }
  }

  async function markWatched(movieId) {
    try {
      await api.watchlist.markWatched(movieId);
      ui.success('Marked as watched!');
      loadProfile();
    } catch (err) { ui.error(err.message); }
  }

  async function sendRequest(userId) {
    try {
      await api.friends.sendRequest(userId);
      ui.success('Friend request sent!');
      loadProfile();
    } catch (err) { ui.error(err.message); }
  }

  async function acceptRequest(userId) {
    try {
      await api.friends.accept(userId);
      ui.success('Friend added!');
      loadProfile();
    } catch (err) { ui.error(err.message); }
  }

  async function removeFriend(userId) {
    if (!confirm('Remove this friend?')) return;
    try {
      await api.friends.remove(userId);
      ui.success('Friend removed');
      loadProfile();
    } catch (err) { ui.error(err.message); }
  }

  loadProfile();
</script>
</body>
</html>
